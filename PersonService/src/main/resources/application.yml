spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost/person-service-db
    username: postgres
    password: 12345

server:
  port: 8082

# Verbose framework logging only for local development: run with --spring.profiles.active=dev
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.apache: debug
    org.hibernate.SQL: debug
