spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost/person-service-db
    username: postgres
    password: 12345

server:
  port: 8082

person:
  pii:
    # Base64-encoded 256-bit AES key, injected at runtime from KMS/Vault. No default: startup fails without it.
    encryption-key: ${PERSON_PII_ENCRYPTION_KEY:}
