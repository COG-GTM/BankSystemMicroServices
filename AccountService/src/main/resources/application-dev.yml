spring:
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:account-service-db-dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    data: classpath:data-dev.sql
    initialization-mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true

server:
  port: 8081
