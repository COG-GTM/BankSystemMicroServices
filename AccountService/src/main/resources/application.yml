spring:
  datasource:
    driverClassName: org.postgresql.Driver
    # Credentials have no defaults: supply them from a secret store via the environment.
    # Non-local DB_URL values must include sslmode=require (or verify-ca / verify-full).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/account-service-db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  port: 8081
