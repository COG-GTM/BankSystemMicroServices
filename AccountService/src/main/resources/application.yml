spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost/account-service-db
    username: postgres
    password: 12345

server:
  port: 8081

retention:
  financial-records:
    # Closed bills/accounts and their payments, adjustments and transfers are kept at least this long.
    years: 5
    purge-enabled: true
    purge-cron: "0 0 3 * * *"
