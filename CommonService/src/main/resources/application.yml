# Web UI sign-in accounts. Nothing is configured by default: the service refuses to start until at
# least one user is supplied, e.g. through COMMON_SECURITY_USERS_0_USERNAME / _PASSWORD / _ROLES.
# Passwords must be pre-encoded ({bcrypt}...). Roles: STAFF (view/create/update), ADMIN (STAFF + delete).
#
# common:
#   security:
#     users:
#       - username: alice
#         password: "{bcrypt}$2a$10$..."
#         roles: [STAFF, ADMIN]

spring:
  mvc:
    hiddenmethod:
      filter:
        enabled: true

thymeleaf:
  prefix: classpath:/templates/
